plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }

    maven {
        url "https://jitpack.io"
        content {
            includeGroup "com.github.rtyley"
        }
    }

    maven {
        url "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.ftb.mods"
        }
    }

    maven {
        // Shadows
        url "https://maven.shadowsoffire.dev/releases"
        content {
            includeGroup "dev.shadowsoffire"
            includeGroup "snownee.jade"
        }
    }

    maven {
        // Curios
        url "https://maven.theillusivec4.top"
        content {
            includeGroupByRegex "top\\.theillusivec4.*"
        }
    }

    maven {
        // Patchouli
        url "https://maven.blamejared.com"
        content {
            includeGroup "vazkii.patchouli"
            includeGroupByRegex "net\\.darkhax.*"
            includeGroupByRegex "com\\.blamejared.*"
            includeGroup "org.openzen.zencode"
            includeGroup "mezz.jei"
        }
    }

    repositories {
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }
    }

    repositories {
        maven {
            url = uri("https://maven.puffish.net")
        }
    }

    maven {
        url "https://chocolateminecraft.com/maven"
        name "Xaero's Maven"
    }

    maven {
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup("software.bernie.geckolib")
        }
    }

    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }

    maven {
        name = "Iron's Maven - Release"
        url = "https://code.redspace.io/releases"
    }

    maven { url = "https://maven.architectury.dev" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    //maven { url 'https://maven.wispforest.io/releases' }

    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()

            jvmArgument("-Xmx4G")

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        client2 {
            client()

            jvmArgument("-Xmx4G")

            programArguments.addAll '--username', 'AwesomeDev2'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    api("dev.latvian.mods:kubejs-neoforge:$kubejs_version")
    interfaceInjectionData("dev.latvian.mods:kubejs-neoforge:$kubejs_version")
    implementation("curse.maven:paragliders-289240:6739615")
    implementation("curse.maven:walljumptxf-909143:6584352")

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    implementation "curse.maven:numismatics-889722:7168396"

    implementation "snownee.jade:Jade-NeoForge:${minecraft_version}-${jadeVersion}"

    compileOnly("dev.emi:emi-neoforge:${emi_version}:api")
    runtimeOnly("dev.emi:emi-neoforge:${emi_version}")

    implementation "top.theillusivec4.curios:curios-neoforge:${curiosVersion}"
    //implementation("io.wispforest:accessories-neoforge:${accessories_version}")
    //implementation "curse.maven:accessories-compat-layer-1315611:7585673"

    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}"

    implementation "dev.shadowsoffire:Placebo:${minecraft_version}-${placeboVersion}"
    implementation "dev.shadowsoffire:GatewaysToEternity:${minecraft_version}-${gatewaysVersion}"
    implementation "dev.shadowsoffire:Apotheosis:${minecraft_version}-${apotheosisVersion}"
    implementation "vazkii.patchouli:Patchouli:${patchouliVersion}"

    compileOnly "io.redspace:atlas_api:${minecraft_version}-${atlas_api_version}:api"
    localRuntime "io.redspace:atlas_api:${minecraft_version}-${atlas_api_version}"

    implementation "io.redspace:irons_spellbooks:${minecraft_version}-${irons_spells_version}"
    implementation "io.redspace:irons_jewelry:${minecraft_version}-${irons_jewelry_version}"

    implementation("net.puffish:attributesmod:${pufferfishsAttributesVersion}:neoforge")
    implementation("net.puffish:skillsmod:${pufferfishsSkillsVersion}:neoforge")

    implementation "curse.maven:pufferfishs-unofficial-additions-935166:7389968"
    implementation "curse.maven:additional-attributes-986624:6388896"

    implementation "curse.maven:silent-lib-242998:6565251"
    implementation "curse.maven:silent-gear-297039:7634317"
    implementation "curse.maven:silents-gems-220311:7512691"

    implementation "curse.maven:octo-lib-916747:6932487"
    implementation "curse.maven:artifacts-312353:7468997"
    implementation "curse.maven:relics-mod-445274:7586568"
    implementation "curse.maven:rar-compat-1100379:6879980"

    implementation "xaero.minimap:xaerominimap-neoforge-${minecraft_version}:${xaeroMinimapVersion}"
    implementation "xaero.map:xaeroworldmap-neoforge-${minecraft_version}:${xaeroWorldMapVersion}"

    runtimeOnly("dev.architectury:architectury-neoforge:13.0.8")

    compileOnly("dev.ftb.mods:ftb-ultimine:${ftb_ultimine_version}")
    runtimeOnly("dev.ftb.mods:ftb-ultimine-neoforge:${ftb_ultimine_version}")

    compileOnly("dev.ftb.mods:ftb-teams:${ftb_teams_version}")
    runtimeOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}")

    compileOnly("dev.ftb.mods:ftb-quests:${ftb_quests_version}")
    runtimeOnly("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}")

    implementation "curse.maven:ftb-teams-forge-404468:7369021"
    implementation "curse.maven:ftb-quests-forge-289412:7429016"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
